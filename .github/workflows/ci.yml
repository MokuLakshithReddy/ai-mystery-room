name: AI Mystery Room CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies (npm ci)
        working-directory: ./server
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/ai_mystery_room_ci

  frontend-checks:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies (npm ci)
        working-directory: ./client
        run: npm ci

      - name: Run Frontend Component Tests
        working-directory: ./client
        run: npm test

      - name: Build Production Bundle
        working-directory: ./client
        run: npm run build
