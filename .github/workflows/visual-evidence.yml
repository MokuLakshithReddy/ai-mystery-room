name: Live Demo Visual Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/visual-evidence.yml"
      - "client/scripts/capture-public-demo.mjs"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-public-demo:
    name: Capture production UI screenshots and short recording
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
        working-directory: client

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Capture public production routes
        run: node scripts/capture-public-demo.mjs
        working-directory: client
        env:
          DEMO_URL: https://client-tau-sable-95.vercel.app


      - name: Commit captured screenshots to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/home.png docs/screenshots/create-case.png docs/screenshots/navigation-demo.webm docs/screenshots/capture-manifest.json
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs: add captured production screenshots"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload screenshots and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-mystery-room-visual-evidence
          path: docs/screenshots/
          if-no-files-found: warn
          retention-days: 90
